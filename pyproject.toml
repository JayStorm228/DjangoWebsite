[project]
name = "trshop"
version = "0.2.0"
description = "Учебный интернет-магазин курсов на Django и Django REST Framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.3,<6.2",
    "djangorestframework>=3.16",
    "django-filter>=25.1",
    "drf-spectacular>=0.28",
    "pillow>=11.0",
    "whitenoise>=6.9",
    "python-dotenv>=1.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations", "staticfiles", "media"]

[tool.ruff.lint]
select = [
    "E",   # Ошибки стиля pycodestyle
    "F",   # Ошибки Pyflakes: неиспользуемые импорты и переменные
    "I",   # Сортировка импортов
    "B",   # Потенциальные ошибки и опасные конструкции
    "UP",  # Возможности современного Python
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.djlint]
profile = "django"
indent = 4
max_line_length = 120

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["shop/tests", "api/tests"]
addopts = "-q"

[tool.coverage.run]
source = ["shop", "api", "config"]
omit = ["*/migrations/*", "*/tests/*"]

[dependency-groups]
dev = [
    "djlint>=1.46.6",
    "pytest-django>=4.14.0",
    "pytest-cov>=6.0",
    "ruff>=0.17.1",
]
