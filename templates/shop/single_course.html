{% extends "shop/base.html" %}
{% block title %}{{ course.title }}{% endblock %}
{% block content %}
    {% block shop_content %}
        <h1>{{ course.title }}</h1>
        <h2>{{ course.category }}</h2>
        <p>{{ course.price }}</p>
        <p>{{ course.students_qty }}</p>
        <button type="button" class="btn btn-primary btn-lg w-100 mt-3">Buy</button>
        <a type="button"
           class="btn btn-primary btn-lg w-100 mt-3"
           href="{% url 'shop:index' %}">Назад</a>
    {% endblock %}
{% endblock %}
