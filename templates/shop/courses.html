{% extends "shop/base.html" %}
{% block shop_content %}
  <div class="d-flex justify-content-center">
    <table class="table table-striped table-hover table-bordered w-auto align-middle">
      <thead class="table-dark">
        <tr>
          <th>Title</th>
          <th>Price</th>
          <th>Students Quantity</th>
          <th>Category</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        {% for course in courses %}
          <tr>
            <td>{{ course.title }}</td>
            <td>{{ course.price }}</td>
            <td>{{ course.student_qty }}</td>
            <td>{{ course.category }}</td>
            <td>
              <button type="button" class="btn btn-primary btn-lg w-100 mt-3">Buy</button>
            </td>
          </tr>
        {% empty %}
          <tr>
            <td colspan="5" class="text-center">Курсов нет</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
