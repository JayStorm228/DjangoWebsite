{% extends "shop/base.html" %}

{% block shop_content %}
<table class="table table-striped table-hover table-bordered">
  <thead class="table-dark">
    <tr>
      <th>Title</th>
      <th>Price</th>
      <th>Students Quantity</th>
      <th>Category</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    {% for course in courses %}
      <tr>
        <td>{{ course.title }}</td>
        <td>{{ course.price }}</td>
        <td>{{ course.student_qty }}</td>
        <td>{{ course.category }}</td>
        <td>
          <div><button type="button">Buy</button></div>
        </td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="5">Курсов нет</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
