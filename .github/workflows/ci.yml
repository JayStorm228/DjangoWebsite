name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "django>=6.1.3,<6.2" djangorestframework django-filter \
            drf-spectacular pillow whitenoise python-dotenv \
            pytest-django ruff djlint

      - name: Lint Python
        run: |
          ruff check .
          ruff format --check .

      - name: Lint templates
        run: djlint --lint --profile django templates

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest

  deploy-check:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-enough-0123456789-abcdefghij
      DJANGO_ALLOWED_HOSTS: example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "django>=6.1.3,<6.2" djangorestframework django-filter \
            drf-spectacular pillow whitenoise python-dotenv

      - name: Django deploy checks
        run: |
          python manage.py check --deploy --fail-level WARNING
          python manage.py collectstatic --no-input
